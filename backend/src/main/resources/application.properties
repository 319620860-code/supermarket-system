# 应用基本配置
spring.application.name=supermarket-backend
server.port=8080
server.address=0.0.0.0

# 可选本地覆盖（不提交到 Git）：存在 classpath:application-local.properties 时自动合并
spring.config.import=optional:classpath:application-local.properties

# 数据库配置（密码等敏感项可用环境变量覆盖，见 application-local.properties.example）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/supermarket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus配置
mybatis-plus.type-aliases-package=com.supermarket.backend.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 允许循环依赖
spring.main.allow-circular-references=true

# Spring Security配置（默认仅开发用；生产请改环境变量）
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}

# JWT配置（生产环境务必设置环境变量 JWT_SECRET）
jwt.secret=${JWT_SECRET:8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c}
jwt.expiration=${JWT_EXPIRATION:86400000}

# 日志配置
logging.level.root=INFO
logging.level.org.apache.ibatis=WARN
logging.level.com.baomidou.mybatisplus=WARN
logging.level.com.supermarket.backend=INFO
logging.file.name=logs/supermarket.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Spring Boot DevTools：target/classes 变更后自动重启（请用 mvn spring-boot:run 或 npm run dev:back，勿长期用 java -jar 做开发）
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=false
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms

# 时间时区配置
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Redis缓存配置（开发环境使用内存缓存，避免Redis依赖）
# spring.data.redis.host=${REDIS_HOST:localhost}
# spring.data.redis.port=${REDIS_PORT:6379}
# spring.data.redis.password=${REDIS_PASSWORD:}
# spring.data.redis.database=${REDIS_DATABASE:0}
# spring.data.redis.timeout=3000ms
# spring.cache.type=redis
# spring.cache.redis.time-to-live=1800000
# spring.cache.redis.cache-null-values=false

# 开发环境使用简单内存缓存
spring.cache.type=simple

# 定时任务配置
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.scheduler.instanceName=SupermarketScheduler
spring.quartz.properties.org.quartz.threadPool.threadCount=10
