# 应用基本配置
spring.application.name=supermarket-backend
server.port=8080
server.address=0.0.0.0

# 可选本地覆盖（不提交到 Git）：存在 classpath:application-local.properties 时自动合并
spring.config.import=optional:classpath:application-local.properties

# 数据库配置（密码等敏感项可用环境变量覆盖，见 application-local.properties.example）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/supermarket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus配置
mybatis-plus.type-aliases-package=com.supermarket.backend.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 允许循环依赖
spring.main.allow-circular-references=true

# Spring Security配置（默认仅开发用；生产请改环境变量）
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}

# JWT配置（生产环境务必设置环境变量 JWT_SECRET）
jwt.secret=${JWT_SECRET:8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c}
jwt.expiration=${JWT_EXPIRATION:86400000}

# 日志配置
logging.level.root=INFO
logging.level.org.apache.ibatis=WARN
logging.level.com.baomidou.mybatisplus=WARN
logging.level.com.supermarket.backend=INFO
logging.file.name=logs/supermarket.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Spring Boot DevTools：target/classes 变更后自动重启（请用 mvn spring-boot:run 或 npm run dev:back，勿长期用 java -jar 做开发）
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=false
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms

# 时间时区配置
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Redis缓存配置（开发环境使用内存缓存，避免Redis依赖）
# spring.data.redis.host=${REDIS_HOST:localhost}
# spring.data.redis.port=${REDIS_PORT:6379}
# spring.data.redis.password=${REDIS_PASSWORD:}
# spring.data.redis.database=${REDIS_DATABASE:0}
# spring.data.redis.timeout=3000ms
# spring.cache.type=redis
# spring.cache.redis.time-to-live=1800000
# spring.cache.redis.cache-null-values=false

# 开发环境使用简单内存缓存
spring.cache.type=simple

# 定时任务配置
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.scheduler.instanceName=SupermarketScheduler
spring.quartz.properties.org.quartz.threadPool.threadCount=10

# ===================== RocketMQ：订单超时未支付自动取消 =====================
# NameServer 地址（多个用分号分隔）。未部署 Broker 时应用仍能正常启动，发送会降级为告警日志。
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=supermarket-order-producer
rocketmq.producer.send-message-timeout=3000
rocketmq.producer.retry-times-when-send-failed=2
rocketmq.consumer.group=supermarket-order-timeout-consumer

# 业务参数
# 是否启用 RocketMQ 发送/消费（false 时只依赖兜底扫描，便于小内存服务器部署）
order.timeout.mq.enabled=${ORDER_TIMEOUT_MQ_ENABLED:true}
# 订单支付超时时间（分钟）
order.timeout.minutes=${ORDER_TIMEOUT_MINUTES:10}
# RocketMQ 延迟等级：1=1s 2=5s 3=10s 4=30s 5=1m 6=2m 7=3m 8=4m 9=5m 10=6m
# 11=7m 12=8m 13=9m 14=10m 15=20m 16=30m 17=1h 18=2h
order.timeout.delay-level=${ORDER_TIMEOUT_DELAY_LEVEL:14}
# 兜底扫描：即使 MQ 不可用/消息丢失，超时取消也能生效（可靠性保障）
order.timeout.fallback-scan.enabled=${ORDER_TIMEOUT_FALLBACK_ENABLED:true}
order.timeout.fallback-scan.cron=${ORDER_TIMEOUT_FALLBACK_CRON:0 */1 * * * ?}

# ===================== 支付 =====================
# 是否启用模拟支付网关（无真实商户资质时用于演示完整支付链路）
payment.mock.enabled=${PAYMENT_MOCK_ENABLED:true}
# 模拟网关自动回调延迟（毫秒），仅用于演示；0 表示不自动回调
payment.mock.auto-confirm-delay-ms=${PAYMENT_MOCK_AUTO_CONFIRM_MS:0}
